<svg xmlns="http://www.w3.org/2000/svg" width="150" height="176" viewBox="0 0 150 176" role="img" aria-label="BattleShips">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/><stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73FDFF" stop-opacity=".55"/><stop offset=".5" stop-color="#7A81FF" stop-opacity=".25"/><stop offset="1" stop-color="#FF8AE2" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="ic"><rect x="0" y="0" width="92" height="92" rx="22"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
    <style>
      .f { animation: f 4s ease-in-out infinite -1.2s; }
      @keyframes f { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      .n { font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #E6EDF3; text-anchor: middle; }
    </style>
  </defs>
  <rect x="2" y="2" width="146" height="172" rx="22" fill="url(#card)" stroke="url(#rim)" stroke-width="1.5"/>
  <g class="f"><g transform="translate(29 22)" filter="url(#sh)"><g clip-path="url(#ic)"><image href="data:image/png;base64," width="92" height="92"/></g></g></g>
  <text class="n" x="75" y="148">BattleShips</text>
</svg>