<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Adem Polat — Mobile Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1f5c"/>
      <stop offset="1" stop-color="#0e3b55"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1" spreadMethod="reflect">
      <stop offset="0" stop-color="#73FDFF"/>
      <stop offset="0.5" stop-color="#7A81FF"/>
      <stop offset="1" stop-color="#FF8AE2"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A81FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7A81FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kt" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E44857"/><stop offset=".5" stop-color="#C811E2"/><stop offset="1" stop-color="#7F52FF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .t { font: 700 34px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4A3826; text-anchor: middle; dominant-baseline: central; }
      .p { font: 700 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4A3826; text-anchor: middle; }
      .float1 { animation: f 6s ease-in-out infinite; }
      .float2 { animation: f 7s ease-in-out infinite -2s; }
      .float3 { animation: f 5.5s ease-in-out infinite -4s; }
      .spin  { animation: r 14s linear infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      .tw2 { animation-delay: -1s; } .tw3 { animation-delay: -2s; }
      .title { font: 800 64px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: url(#name); }
      .sub { font: 600 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #CFd6FF; letter-spacing: 3px; }
      .chip { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; }
      .fade { animation: in 1.2s ease-out both; }
      .fade2 { animation: in 1.2s ease-out 0.4s both; }
      .fade3 { animation: in 1.2s ease-out 0.8s both; }
      @keyframes f { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes r { to { transform: rotate(360deg) } }
      @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
      @keyframes in { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <circle cx="500" cy="150" r="230" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="80" cy="60" r="2"/>
    <circle class="twinkle tw2" cx="210" cy="280" r="1.6"/>
    <circle class="twinkle tw3" cx="350" cy="40" r="1.8"/>
    <circle class="twinkle" cx="640" cy="300" r="1.6"/>
    <circle class="twinkle tw2" cx="760" cy="50" r="2.2"/>
    <circle class="twinkle tw3" cx="930" cy="270" r="1.8"/>
    <circle class="twinkle tw2" cx="455" cy="305" r="1.4"/>
    <circle class="twinkle" cx="560" cy="28" r="1.5"/>
  </g>

  <!-- floating tool icons -->
  <g filter="url(#shadow)">
    <g transform="translate(95 130) rotate(-10)"><g class="float1"><rect x="-32" y="-32" width="64" height="64" rx="16" fill="url(#kt)"/><path transform="translate(-16.8 -16.8) scale(1.4)" fill="#fff" d="M24 24H0V0h24L12 12Z"/></g></g>
