  </g>

  <!-- orbiting phone -->
  <g transform="translate(285 85)">
    <g class="spin">
      <circle r="34" fill="none" stroke="#73FDFF" stroke-opacity=".35" stroke-dasharray="4 7"/>
      <circle cx="34" cy="0" r="5" fill="#73FDFF"/>
    </g>
  </g>
  <g transform="translate(715 175)">
    <g class="spin">
      <circle r="26" fill="none" stroke="#FF8AE2" stroke-opacity=".35" stroke-dasharray="3 6"/>
      <circle cx="0" cy="26" r="4" fill="#FF8AE2"/>
    </g>
  </g>

  <!-- name -->
  <text class="title fade" x="500" y="150" text-anchor="middle">Adem Polat</text>
  <text class="sub fade2" x="500" y="192" text-anchor="middle">MOBILE DEVELOPER · ANDROID &amp; iOS</text>

  <!-- chips -->
  <g class="fade3">
    <g transform="translate(300 225)">
      <rect width="130" height="38" rx="19" fill="#34A853" fill-opacity=".9"/>
      <text class="chip" x="65" y="25" text-anchor="middle">▶ 13 Android</text>
    </g>
    <g transform="translate(445 225)">
      <rect width="110" height="38" rx="19" fill="#0A84FF" fill-opacity=".9"/>
      <text class="chip" x="55" y="25" text-anchor="middle">● 3 iOS</text>
    </g>
    <g transform="translate(570 225)">
      <rect width="130" height="38" rx="19" fill="#7A81FF" fill-opacity=".9"/>
      <text class="chip" x="65" y="25" text-anchor="middle">📍 İstanbul</text>
    </g>
  </g>
</svg>
